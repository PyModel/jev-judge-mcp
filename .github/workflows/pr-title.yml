name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

# The squash merge uses the pull request title as the commit subject on main, and release-please
# builds the changelog from those subjects. `edited` re-runs the check when the title changes.
jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.19"
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
      # The title is untrusted input: it reaches the script only through the environment.
      - run: uv run --no-project python scripts/check_pr_title.py
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

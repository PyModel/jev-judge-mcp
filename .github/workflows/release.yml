name: Release

# Conventional Commits on main -> a release pull request. Merging it -> a draft GitHub Release with its
# tag (release-please-config.json: draft + force-tag-creation). The tagged commit is then built, its
# assets and checksums uploaded, re-downloaded, installed into a fresh venv, and checked; only then is
# the release published. Any failure leaves the release a draft. The verified wheel and sdist are
# uploaded to PyPI through trusted publishing (OIDC, no stored token) only when the repository variable
# PYPI_PUBLISH is 'true'; otherwise the release stays GitHub-only. A manual retry requires the original verification run.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      republish_tag:
        description: Existing release tag to upload to PyPI after a failed upload
        required: false
        type: string
      verified_run:
        description: Optional original Release workflow run ID for a manual PyPI retry
        required: false
        type: string

permissions: {}

# One release at a time; a queued run waits instead of cancelling one mid-release.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    if: github.ref == 'refs/heads/main' && inputs.republish_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # release commits, tags, draft releases
      pull-requests: write # the release pull request
      issues: write # its autorelease labels (the action's documented minimum)
    outputs:
      release_created: ${{ steps.releaser.outputs.release_created }}
      tag_name: ${{ steps.releaser.outputs.tag_name }}
      sha: ${{ steps.releaser.outputs.sha }}
      prs_created: ${{ steps.releaser.outputs.prs_created }}
      pr: ${{ steps.releaser.outputs.pr }}
    steps:
      # Config and manifest only: a `release-type` input would bypass both and drop `draft`.
      - id: releaser
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build
    outputs:
      manifest_digest: ${{ steps.checksums.outputs.digest }}
    needs: version
    if: needs.version.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload assets onto the draft release
    env:
      TAG: ${{ needs.version.outputs.tag_name }}
      TAG_SHA: ${{ needs.version.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.version.outputs.tag_name }}
          persist-credentials: false
      - name: Confirm the tagged commit and a draft release
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TAG_SHA"
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false
      - name: Build one wheel and one sdist at the tag version
        run: |
          set -euo pipefail
          rm -rf dist
          uv build
          uv run --no-project scripts/check_release_version.py dist dist "$TAG"
      - id: checksums
        name: Write checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- *.whl *.tar.gz > SHA256SUMS.txt
          sha256sum SHA256SUMS.txt | cut -d " " -f 1 | sed "s/^/digest=/" >> "$GITHUB_OUTPUT"
      - name: Upload onto the draft release
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt --clobber

  verify:
    name: Verify and publish
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # drafts and their assets are visible only with write; also the final undraft
    env:
      TAG: ${{ needs.version.outputs.tag_name }}
      TAG_SHA: ${{ needs.version.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.version.outputs.tag_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false
      - name: Download the release assets and check their sums
        env:
          BUILT_MANIFEST: ${{ needs.build.outputs.manifest_digest }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/assets"
          gh release download "$TAG" --dir "$assets"
          cd "$assets"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$TAG_SHA"
          mkdir "$RUNNER_TEMP/receipt"
          sha256sum -- *.whl *.tar.gz > "$RUNNER_TEMP/receipt/SHA256SUMS.txt"
          digest=$(sha256sum "$RUNNER_TEMP/receipt/SHA256SUMS.txt" | cut -d " " -f 1)
          test "$digest" = "$BUILT_MANIFEST"
          cmp SHA256SUMS.txt "$RUNNER_TEMP/receipt/SHA256SUMS.txt"
          uv run --no-project "$GITHUB_WORKSPACE/scripts/check_release_version.py" dist . "$TAG"
      - name: Install the wheel into a fresh venv and check the installed version
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/verify-venv"
          uv venv --python "$(cat .python-version)" "$venv"
          uv pip install --python "$venv/bin/python" "$RUNNER_TEMP"/assets/*.whl
          # -I: no checkout, script directory, or PYTHONPATH on sys.path; jev_judge_mcp must come from the wheel.
          cd "$RUNNER_TEMP"
          "$venv/bin/python" -I "$GITHUB_WORKSPACE/scripts/check_release_version.py" installed "$TAG"
      - name: Save the verified manifest for publication and retries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-${{ env.TAG }}-${{ env.TAG_SHA }}
          path: ${{ runner.temp }}/receipt/SHA256SUMS.txt
          if-no-files-found: error
          overwrite: true

      - name: Publish the release
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          gh release edit "$TAG" --draft=false

  pypi:
    name: Publish to PyPI
    needs: [version, verify]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      ((needs.verify.result == 'success' && vars.PYPI_PUBLISH == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.republish_tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write # PyPI trusted publishing (OIDC)
    environment: pypi
    env:
      TAG: ${{ inputs.republish_tag || needs.version.outputs.tag_name }}
      REQUESTED_RUN: ${{ inputs.verified_run }}
      RETRY_TAG: ${{ inputs.republish_tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false
      - name: Authenticate the verification run
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]
          SOURCE_RUN=$GITHUB_RUN_ID
          tag_sha=$(git rev-parse HEAD)
          receipt="verified-$TAG-$tag_sha"
          if [[ -n "$RETRY_TAG" ]]; then
            if [[ -n "$REQUESTED_RUN" ]]; then
              SOURCE_RUN=$REQUESTED_RUN
            else
              SOURCE_RUN=$(gh api --method GET "repos/$GH_REPO/actions/artifacts" -f name="$receipt" \
                --jq '[.artifacts[] | select(.expired == false)] | first | .workflow_run.id // empty')
            fi
            [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || { echo "Missing verification run for $TAG" >&2; exit 1; }
            test "$SOURCE_RUN" != "$GITHUB_RUN_ID"
            gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" |
              jq -e --arg repo "$GH_REPO" '
                .head_repository.full_name == $repo and .head_branch == "main" and
                .path == ".github/workflows/release.yml" and
                (.event == "push" or .event == "workflow_dispatch")' >/dev/null
            gh api --paginate "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs" \
              --jq '.jobs[] | select(.name == "Verify and publish") | .conclusion' | grep -Fx success
          fi
          gh run download "$SOURCE_RUN" --name "$receipt" --dir "$RUNNER_TEMP/receipt"
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false
          gh release download "$TAG" --dir "$RUNNER_TEMP/assets"
      - name: Upload to PyPI through trusted publishing
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/assets"
          sha256sum -- *.whl *.tar.gz > "$RUNNER_TEMP/current-sums"
          cmp "$RUNNER_TEMP/receipt/SHA256SUMS.txt" "$RUNNER_TEMP/current-sums"
          python3 "$GITHUB_WORKSPACE/scripts/check_release_version.py" dist . "$TAG"
          uv publish --trusted-publishing always --no-attestations ./*.whl ./*.tar.gz

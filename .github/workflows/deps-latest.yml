name: deps-latest

# F17′ drift alarm: re-resolve to the newest versions the pyproject.toml bounds allow
# and run the offline suite, so a dependency release that would break a fresh
# `pip install jev-judge-mcp` shows up here as a red run instead of a user report.
# The upgraded lockfile stays in the runner workspace and is never committed.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.19"
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
      # Parity needs the oracle's pinned Node (CI fails a missing Node instead of skipping).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
      - run: uv lock --upgrade
      - run: uv sync --all-extras
      - run: make ci # offline suite (includes eval); no paid stage, no secrets, live-eval flag never set

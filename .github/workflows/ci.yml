name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Fast gates (ruff, pyright, unit, property) run in parallel; every remaining stage is
# gated on all four and then also runs concurrently (no serial chain).
jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.19"
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
      # The workflow check in `make lint` requires actionlint and the runner's ShellCheck.
      # The pin is the CI image's — scripts/ci/install_actionlint.sh and the Dockerfile are one
      # pin in two places, held equal by tests/unit/test_ci_prepush_coverage.py.
      - run: bash scripts/ci/install_actionlint.sh
      - run: uv sync --locked --all-extras
      - run: make lint

  pyright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.19"
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
      - run: uv sync --locked --all-extras
      - run: make typecheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.19"
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
      - run: uv sync --locked --all-extras
      - run: make unit

  property:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.19"
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
      - run: uv sync --locked --all-extras
      - run: make property

  # The remaining stages wait for the fast gates, then run in parallel.
  contract:
    needs: [ruff, pyright, unit, property]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.19"
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
      - run: uv sync --locked --all-extras
      - run: make contract

  parity:
    needs: [ruff, pyright, unit, property]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.19"
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
      # Pinned to the parity oracle's Node (Makefile NODE, tests/parity/harness/reference.sh);
      # a floating 24.x can drift ICU rendering.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
      - run: uv sync --locked --all-extras
      - run: make parity
      - run: make policy-replay

  security:
    needs: [ruff, pyright, unit, property]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.19"
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
      - run: uv sync --locked --all-extras
      - run: bash scripts/ci/install_ripgrep.sh
      - run: make security

  # ADR-0058: the ReDoS storm contract on a one-CPU budget. Spare runner cores hide a pool that
  # starves benign calls under quota (worker startup inside a deadline loses the CPU race to the
  # storm's own starts and spins), so the whole security stage reruns as a non-root runner in a
  # `--cpus 1` container — the exact command is proven locally in the same image.
  security-one-cpu:
    needs: [ruff, pyright, unit, property]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: security stage under a one-CPU quota, non-root
        run: |
          # ghcr.io/astral-sh/uv:0.12.19-python3.12-trixie-slim, pinned by digest (multi-arch index).
          docker run --rm --cpus 1 --entrypoint sh -v "$PWD":/src:ro \
            ghcr.io/astral-sh/uv@sha256:10b94fe3550b7a96e3982860bb82cdefba6300264a7a40bb9334acf21a450974 -c '
            set -eux
            apt-get update -qq && apt-get install -y -qq make git procps ripgrep >/dev/null
            useradd -m runner
            cp -r /src /home/runner/app && chown -R runner:runner /home/runner/app
            su runner -c "cd ~/app && uv sync --locked --all-extras && make security"
          '

  build:
    needs: [ruff, pyright, unit, property]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.19"
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
      - run: make build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  smoke:
    needs: [ruff, pyright, unit, property]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.19"
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
      - run: uv sync --locked --all-extras
      - run: make smoke
      # ADR-0053 guard: an installer-written entry must start when the first Python on PATH is
      # older than 3.12. setup-python prepends 3.10, so plain uvx resolution fails; the guard
      # proves the written `--python` request still gets the entry running (managed download).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - run: python scripts/ci_old_python_entry.py

  # Offline eval scorer and calibration tests; never run live.
  eval:
    needs: [ruff, pyright, unit, property]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.19"
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
      - run: uv sync --locked --all-extras
      - run: make eval
      # Cheap guard for the load stub: concurrency 1 and 4, no timing budget. The full timing run is
      # `make load` and stays out of CI. Folded in here so it does not spend a runner on a sub-second test.
      - run: make load_canary

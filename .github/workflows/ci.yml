name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Fast gates (ruff, pyright, unit, property) run in parallel; every remaining stage is
# gated on all four and then also runs concurrently (no serial chain).
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-extras
      - run: make lint

  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-extras
      - run: make typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-extras
      - run: make unit

  property:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-extras
      - run: make property
      - run: make policy-coverage

  # The remaining stages wait for the fast gates, then run in parallel.
  contract:
    needs: [ruff, pyright, unit, property]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-extras
      - run: make contract

  parity:
    needs: [ruff, pyright, unit, property]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Pinned to the parity oracle's Node (Makefile NODE, tests/parity/harness/reference.sh);
      # a floating 24.x can drift ICU rendering.
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - run: uv sync --locked --all-extras
      - run: make parity

  security:
    needs: [ruff, pyright, unit, property]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-extras
      - run: make security

  build:
    needs: [ruff, pyright, unit, property]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke:
    needs: [ruff, pyright, unit, property]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-extras
      - run: make smoke

  # Offline eval scorer and calibration tests; never run live.
  eval:
    needs: [ruff, pyright, unit, property]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-extras
      - run: make eval

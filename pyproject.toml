[project]
name = "jev-judge-mcp"
version = "0.1.1"
description = "Behavior-compatible Python MCP server exposing TypeSafe's Jev judgment tools."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohamed Elkholy" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
]
# Bounds are the series uv.lock tests (F17′). mcp and typesafe-sdk are capped at the tested
# minor: the code uses their private internals (server.py `_lowlevel_server`, the
# providers/typesafe.py parse override). Everything else is capped at the next breaking series.
dependencies = [
    "mcp>=2.2,<2.3",
    "httpx>=0.28,<0.29",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "tomlkit>=0.15.1,<0.16",
]

[project.urls]
Homepage = "https://github.com/PyModel/jev-judge-mcp"
Repository = "https://github.com/PyModel/jev-judge-mcp"
Issues = "https://github.com/PyModel/jev-judge-mcp/issues"
Changelog = "https://github.com/PyModel/jev-judge-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
typesafe = ["typesafe-sdk>=0.7.1,<0.8"]
telemetry = ["opentelemetry-sdk>=1.44,<2", "prometheus-client>=0.26,<0.27"]

[project.scripts]
jev-judge-mcp = "jev_judge_mcp.server:main"

[dependency-groups]
dev = [
    "pytest",
    "anyio",
    "respx",
    "hypothesis",
    "pytest-cov",
    "ruff",
    "pyright",
    "pytest-benchmark",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_judge_mcp"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["evals"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S607"]
# S104: non-loopback host literals are gate inputs, never bound. S106: fake tokens for the gate.
"tests/unit/test_http_auth.py" = ["S104", "S106"]
"tests/integration/test_http_auth.py" = ["S104", "S106"]
# S311: the outcome study's pair schedule is a seeded, reproducible shuffle, not a secret.
"evals/ab/**" = ["S603", "S607", "S311"]
"evals/agent.py" = ["S603"]
"evals/relay.py" = ["S603"]
# S311: the bench schedule is a seeded, reproducible shuffle, not a secret.
"evals/bench/**" = ["S603", "S607", "S311"]

[tool.pyright]
include = ["src", "tests", "evals", "scripts"]
# The A/B fixture is a throwaway repo the agent under test edits; its imports resolve only inside that copy.
exclude = ["**/__pycache__", "**/.*", "evals/ab/fixture"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not smoke and not live and not load\""
markers = [
    "smoke: spawns the server through `uvx --from .` (slow; builds the package)",
    "live: calls the real TypeSafe API with TYPESAFE_API_KEY (paid; `make eval-live`)",
    "load: concurrent local-overhead budget with a stubbed provider (`make load`)",
]
